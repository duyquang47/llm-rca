# Isolation boundary per CLAUDE.md §2.4. CNI on this cluster is Cilium,
# which enforces standard NetworkPolicy natively (unlike k3s's default
# flannel, which required migrating to Calico on the old local cluster
# to get any enforcement at all — see project memory for that history).
# Still must be verified empirically here, not assumed from the CNI
# name: exec into a pod in demo/observability and curl a fault-manager
# service, confirm refused/timeout. Verification must be done from
# inside another pod, not by curling from the host: NetworkPolicy only
# governs pod-to-pod traffic, and host-originated traffic is exempted
# by design in most CNIs including Cilium/Calico — curling from the
# host looks "unblocked" even when policy is enforced correctly, which
# is a trap when writing the acceptance test for this.
#
# Blocks ingress into fault-manager-namespace pods from every other
# namespace (observability must never reach the ground truth store,
# and fault-manager must not be scraped/logged) with a single
# NotIn-observability rule — rca was merged into observability, so
# there is now exactly one namespace to exclude.
#
# Defense-in-depth, not the only safeguard: ground truth is a local
# JSON file inside fault-controller's own pod filesystem with no
# network endpoint at all, so context-builder/orchestrator have
# nothing to reach even without this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fault-manager-deny-observability-ingress
  namespace: fault-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: NotIn, values: [observability]}
