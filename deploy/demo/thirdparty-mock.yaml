apiVersion: v1
kind: ConfigMap
metadata:
  name: thirdparty-mock-config
  namespace: demo
data:
  config.yaml: |
    service_name: thirdparty-mock
    listen: ":8080"
    routes:
      - path: /pay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thirdparty-mock
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: thirdparty-mock}
  template:
    metadata:
      labels: {app: thirdparty-mock}
    spec:
      containers:
        - name: app
          image: chain-service:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: CONFIG_PATH, value: /etc/chain/config.yaml}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4317"}
            - {name: OTEL_SERVICE_NAME, value: "thirdparty-mock"}
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 9999, name: fault}
          resources:
            limits: {memory: 64Mi, cpu: 200m}
          volumeMounts:
            - {name: cfg, mountPath: /etc/chain}
      volumes:
        - name: cfg
          configMap: {name: thirdparty-mock-config}
---
apiVersion: v1
kind: Service
metadata:
  name: thirdparty-mock
  namespace: demo
spec:
  selector: {app: thirdparty-mock}
  ports:
    - {port: 8080, targetPort: 8080}
