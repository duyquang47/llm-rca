apiVersion: v1
kind: ConfigMap
metadata:
  name: thirdparty-mock-config
  namespace: demo
data:
  config.yaml: |
    service_name: thirdparty-mock
    listen: ":8080"
    routes:
      - path: /pay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thirdparty-mock
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: thirdparty-mock}
  template:
    metadata:
      labels: {app: thirdparty-mock}
    spec:
      containers:
        - name: app
          image: docker.io/quang47/go-service-chain:v1.0.1
          imagePullPolicy: Always
          env:
            - {name: CONFIG_PATH, value: /etc/chain/config.yaml}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4317"}
            - {name: OTEL_SERVICE_NAME, value: "thirdparty-mock"}
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 9999, name: fault}
          resources:
            # Requests sized to observed use (~10-30Mi, <30m CPU at 20 rps) so
            # the scheduler doesn't reserve 256Mi per pod on full workers.
            # Limits unchanged: oom_crashloop relies on the 512Mi limit, and
            # cpu_throttling patches the CPU limit to 100m (needs request <= it).
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          volumeMounts:
            - {name: cfg, mountPath: /etc/chain}
      volumes:
        - name: cfg
          configMap: {name: thirdparty-mock-config}
---
apiVersion: v1
kind: Service
metadata:
  name: thirdparty-mock
  namespace: demo
spec:
  selector: {app: thirdparty-mock}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    - {name: fault, port: 9999, targetPort: 9999}
