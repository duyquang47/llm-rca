apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: demo
data:
  config.yaml: |
    service_name: gateway
    listen: ":8080"
    routes:
      - path: /create
        calls:
          - {name: order, url: "http://order:8080/create", timeout: 5s, retry: 1}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: app
          image: docker.io/quang47/llm-rca-chain-service:v1.0
          imagePullPolicy: Always
          env:
            - {name: CONFIG_PATH, value: /etc/chain/config.yaml}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4317"}
            - {name: OTEL_SERVICE_NAME, value: "gateway"}
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 9999, name: fault}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          volumeMounts:
            - {name: cfg, mountPath: /etc/chain}
      volumes:
        - name: cfg
          configMap: {name: gateway-config}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: demo
spec:
  selector: {app: gateway}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    - {name: fault, port: 9999, targetPort: 9999}
