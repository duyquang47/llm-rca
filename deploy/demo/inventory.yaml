apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: demo
data:
  config.yaml: |
    service_name: inventory
    listen: ":8080"
    routes:
      - path: /check
        db:
          dsn: "postgres://app:pass@postgres:5432/shop"
          query: "SELECT stock FROM items WHERE id = $1"
          pool_size: 20
          n_plus_one: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: demo
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: case #12 (config_error)
  # removes CONFIG_PATH via a Deployment patch expecting inventory to
  # show zero available replicas for the fault window. With
  # RollingUpdate, the new (broken) pod never becomes Ready, so k8s
  # never terminates the still-healthy old pod — the Service keeps
  # routing to it the entire time and the fault never actually
  # disrupts anything. Recreate forces the old pod down first.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory}
    spec:
      containers:
        - name: app
          image: docker.io/quang47/llm-rca-chain-service:v1.1
          imagePullPolicy: Always
          env:
            - {name: CONFIG_PATH, value: /etc/chain/config.yaml}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4317"}
            - {name: OTEL_SERVICE_NAME, value: "inventory"}
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 9999, name: fault}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          volumeMounts:
            - {name: cfg, mountPath: /etc/chain}
      volumes:
        - name: cfg
          configMap: {name: inventory-config}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: demo
spec:
  selector: {app: inventory}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    - {name: fault, port: 9999, targetPort: 9999}
