apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: demo
data:
  init.sql: |
    CREATE TABLE items (id INT PRIMARY KEY, stock INT NOT NULL);
    INSERT INTO items (id, stock) VALUES (1, 100), (2, 50), (3, 0);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: app}
            - {name: POSTGRES_PASSWORD, value: pass}
            - {name: POSTGRES_DB, value: shop}
          ports:
            - {containerPort: 5432}
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
      volumes:
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
