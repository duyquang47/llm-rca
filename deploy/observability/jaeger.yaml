# Jaeger all-in-one, for trial trace visualization only (per-pod in-memory
# storage — traces are lost on restart, no separate storage backend wired
# up). Receives traces via a second OTLP exporter added to otel-collector's
# existing traces pipeline (see otel-collector.yaml); does not replace the
# clickhouse exporter RCA itself depends on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
            # Service Performance Monitoring (Monitor tab): reads RED
            # metrics from Prometheus, sourced from otel-collector's
            # spanmetrics connector (see otel-collector.yaml) which the
            # kube-prometheus-stack already scrapes via the existing
            # otel-collector ServiceMonitor — no new scrape config needed.
            - {name: METRICS_STORAGE_TYPE, value: prometheus}
            - {name: PROMETHEUS_SERVER_URL, value: "http://kube-prometheus-stack-prometheus.observability:9090"}
            - {name: PROMETHEUS_QUERY_SUPPORT_SPANMETRICS_CONNECTOR, value: "true"}
            # In-memory storage's trace cap defaults to unlimited — with
            # this demo's continuous traffic that filled the pod's memory
            # limit and OOMKilled it roughly every 11 minutes (confirmed
            # via `kubectl describe pod`: 14 restarts in 157 minutes,
            # Last State Reason=OOMKilled), resetting every consumer's
            # gRPC connection each time it happened. Bounding it trades
            # older traces being evicted for the pod actually staying up.
            # 50000 still OOMed every ~24min (231 restarts total, confirmed
            # via live heap sampling matching RSS almost exactly — not a Go
            # GC/retention artifact): measured ~35KB/trace means 50000
            # traces need ~1.75GB, far above the 1Gi limit below, so the
            # eviction never engages before the hard OOM. 15000 traces
            # (~525MB) leaves real margin under the 1Gi limit.
            - {name: MEMORY_MAX_TRACES, value: "15000"}
          ports:
            - {containerPort: 16686, name: ui}
            - {containerPort: 4317, name: otlp-grpc}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
  labels: {app: jaeger}
spec:
  type: NodePort
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: 16686, nodePort: 30686}
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
