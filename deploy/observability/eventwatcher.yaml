# Own eventwatcher binary (cmd/eventwatcher), not kubernetes-event-exporter.
# CLAUDE.md §5: "k8s event mặc định chỉ sống 1 giờ trong etcd rồi biến
# mất" — kubernetes-event-exporter v1.7.0's watch loop silently stops
# processing events after the first "involvedObject not found" lookup
# error against this k3s v1.36 cluster (reproduced identically across
# two image sources and several config attempts — a binary/API-version
# incompatibility, not a config problem). CLAUDE.md §3 already commits
# to k8s.io/client-go for the RCA services, so this uses the same
# library directly via a SharedInformer instead of a third-party tool.
#
# Writes to the same hostPath file otel-collector's filelog receiver
# tails (logs/events pipeline in otel-collector.yaml) — single-node
# cluster, so hostPath is safe here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eventwatcher
  namespace: observability
---
# Role (not ClusterRole), scoped to the demo namespace only — matches
# eventwatcher's own WATCH_NAMESPACE=demo default. A cluster-wide
# ClusterRole here previously let the informer watch every namespace
# including chaos, which is exactly how the leak above happened: RBAC
# breadth and code scope must agree, or a future code regression that
# drops the namespace filter would silently start leaking again with
# no RBAC error to catch it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eventwatcher
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eventwatcher
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: eventwatcher
    namespace: observability
roleRef:
  kind: Role
  name: eventwatcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventwatcher
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: eventwatcher}
  template:
    metadata:
      labels: {app: eventwatcher}
    spec:
      serviceAccountName: eventwatcher
      containers:
        - name: eventwatcher
          image: eventwatcher:1.0
          imagePullPolicy: IfNotPresent
          # chainguard/static base runs non-root by default, which can't
          # write to the root-owned hostPath dir; fine for a local POC.
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: events, mountPath: /var/log/k8s-events}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: events
          hostPath: {path: /var/log/k8s-events, type: DirectoryOrCreate}
