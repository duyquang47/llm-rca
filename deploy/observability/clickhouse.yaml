# Single-node ClickHouse — unified trace+log store per CLAUDE.md §2.2.
# Schema for otel_traces/otel_logs is created automatically by the
# otel-collector's clickhouse exporter; do not hand-design it (§5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: observability
spec:
  replicas: 1
  # RWO PVC (see below) + single replica means two pods can never
  # safely coexist — RollingUpdate's surge briefly tries anyway,
  # and ClickHouse's own /var/lib/clickhouse/status lock file then
  # makes the new pod refuse to start until the old one fully
  # releases it. Found live: a resource-limit bump triggered a
  # rollout that deadlocked exactly this way (new pod crash-looping
  # on "Cannot lock file... Another server instance is already
  # running", old ReplicaSet never scaling down because the new one
  # never became Ready — Deployment stuck forever without manual
  # intervention). Recreate avoids the surge entirely.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: clickhouse}
  template:
    metadata:
      labels: {app: clickhouse}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - {containerPort: 9000, name: native}
            - {containerPort: 8123, name: http}
          env:
            - {name: CLICKHOUSE_DB, value: otel}
            - {name: CLICKHOUSE_USER, value: otel}
            - {name: CLICKHOUSE_PASSWORD, value: otel}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
          resources:
            requests: {cpu: 1000m, memory: 2Gi}
            limits: {cpu: 2000m, memory: 4Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: clickhouse-data}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: observability
spec:
  selector: {app: clickhouse}
  ports:
    - {name: native, port: 9000, targetPort: 9000}
    - {name: http, port: 8123, targetPort: 8123}
