# Values for prometheus-community/kube-prometheus-stack, sized down for
# the POC's tight local resource budget (CLAUDE.md §8). cAdvisor scraping
# (§5.1 point 1) and kube-state-metrics both come bundled with this
# chart — do not deploy a second standalone kube-state-metrics.
prometheus:
  prometheusSpec:
    retention: 24h
    resources:
      requests: {cpu: 150m, memory: 256Mi}
      limits: {cpu: 350m, memory: 512Mi}
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}

grafana:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 150m, memory: 384Mi}
  adminPassword: admin
  defaultDashboardsEnabled: false

kube-state-metrics:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 50m, memory: 64Mi}

# Re-enabled on the kubeadm cluster (was disabled on the old local k3s
# WSL2 setup only: node-exporter's host-rootfs mount hit a
# WSL2-specific "path / ... not a shared or slave mount" runc issue,
# not something fixable via chart config). Real Linux VM nodes here
# have no such limitation — confirmed via `uname -a` — so this now
# runs, giving host-level node metrics on top of the cAdvisor
# container metrics CLAUDE.md §5.1 already required.
nodeExporter:
  enabled: true
prometheus-node-exporter:
  enabled: true
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 50m, memory: 64Mi}

prometheusOperator:
  resources:
    requests: {cpu: 30m, memory: 64Mi}
    limits: {cpu: 100m, memory: 128Mi}
