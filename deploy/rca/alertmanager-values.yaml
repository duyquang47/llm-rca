# Alertmanager route to incident-orchestrator's webhook. Applied via:
#   helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n observability --reuse-values -f deploy/rca/alertmanager-values.yaml
# --reuse-values merges this on top of the original
# kube-prometheus-stack-values.yaml (grafana memory, disabled
# node-exporter, etc.) instead of resetting them.
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - equal: [namespace, alertname]
        source_matchers: [severity = critical]
        target_matchers: [severity =~ warning|info]
      - equal: [namespace, alertname]
        source_matchers: [severity = warning]
        target_matchers: [severity = info]
      - equal: [namespace]
        source_matchers: [alertname = InfoInhibitor]
        target_matchers: [severity = info]
      - target_matchers: [alertname = InfoInhibitor]
    route:
      receiver: "null"
      group_by: [namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers: [alertname = "Watchdog"]
          receiver: "null"
        # Manual-investigation mode (rcactl list/scan/analyze): a rule
        # opts in by adding label investigation_mode: manual. Placed
        # before the demo route below since Alertmanager routes are
        # first-match-wins and this matcher is more specific — without
        # this ordering, a manual-mode alert with namespace=demo would
        # match the demo route first and silently skip this one. No
        # existing PrometheusRule carries this label yet, so this route
        # never fires until one is deliberately opted in.
        - matchers: [investigation_mode = "manual"]
          receiver: orchestrator-webhook-manual
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
        # Matches on the service label existing rather than listing
        # alertnames one by one — HighErrorRate (added after scenario
        # #2 showed HighP99Latency alone can't see fast-failing errors)
        # would otherwise fall through to the null receiver just like
        # any other new SLO rule added later without remembering to
        # update this route too.
        #
        # namespace=demo added when migrating to a real shared cluster:
        # without it, this route also caught the cluster's own
        # kube-system infra alerts (etcdInsufficientMembers,
        # TargetDown for kube-scheduler/kube-controller-manager — they
        # carry a `service` label too), sending them to orchestrator
        # and burning Gemini quota on incidents the LLM had no real
        # context for. Didn't show up on the old single-tenant local
        # k3s cluster, which had no other alertable workloads.
        - matchers: [service =~ ".+", namespace = "demo"]
          receiver: orchestrator-webhook
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
    receivers:
      - name: "null"
      - name: orchestrator-webhook
        webhook_configs:
          - url: "http://orchestrator.observability.svc.cluster.local:8080/webhook"
            send_resolved: false
      - name: orchestrator-webhook-manual
        webhook_configs:
          - url: "http://orchestrator.observability.svc.cluster.local:8080/webhook/manual"
            send_resolved: false
