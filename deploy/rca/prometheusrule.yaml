# SLO-based alert per CLAUDE.md §6.1 ("Alert rule nên là SLO-based
# (error ratio, p99 latency, burn rate), không phải 'CPU cao'").
# service label is templated from exported_job — see the note in
# internal/telemetry/prometheus/source.go about why the demo services'
# real job name ends up under exported_job, not job, once scraped
# through otel-collector's single Prometheus exporter target.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-slo-alerts
  namespace: observability
  labels: {release: kube-prometheus-stack}
spec:
  groups:
    - name: demo-slo
      rules:
        - alert: HighP99Latency
          expr: |
            histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[1m])) by (le, exported_job)) > 1
          for: 30s
          labels:
            severity: critical
            namespace: demo
            service: "{{ $labels.exported_job }}"
          annotations:
            summary: "p99 latency for {{ $labels.exported_job }} exceeded 1s"
        # Added after scenario #2 (bad_deploy) proved HighP99Latency alone
        # is blind to fast-failing errors: a 500 returned immediately
        # doesn't move p99 latency at all, only the error ratio does.
        # CLAUDE.md §6.1 lists error ratio as its own SLO type, not a
        # latency proxy — this is that missing rule, not a latency tweak.
        - alert: HighErrorRate
          expr: |
            sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1m])) by (exported_job)
            /
            sum(rate(http_server_request_duration_seconds_count[1m])) by (exported_job)
            > 0.1
          for: 30s
          labels:
            severity: critical
            namespace: demo
            service: "{{ $labels.exported_job }}"
          annotations:
            summary: "error ratio for {{ $labels.exported_job }} exceeded 10%"
        # Added for case #9 (consumer lag): scaling notify-worker to 0
        # produces zero HTTP-level symptom — order's publish to the
        # Redis Stream is fire-and-forget (XADD succeeds whether or not
        # any consumer exists), so the request stays 200 OK exactly as
        # CLAUDE.md §7's own case #9 description says, and neither
        # HighP99Latency nor HighErrorRate has anything to fire on.
        # kube-state-metrics is already deployed and already tracks
        # this — no new component needed, just a rule using it.
        - alert: DeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="demo"} == 0
          for: 30s
          labels:
            severity: critical
            namespace: demo
            service: "{{ $labels.deployment }}"
          annotations:
            summary: "{{ $labels.deployment }} has zero available replicas"
