apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-8-retry-storm
  namespace: fault-manager
data:
  scenario.yaml: |
    name: retry_storm
    steps:
      - target: inventory
        action: set_config
        params:
          route: /check
          error: {probability: 1.0, code: 500}
      - target: order
        action: set_config
        params:
          route: inventory
          retry: 2
      - target: gateway
        action: set_config
        params:
          route: order
          retry: 2
      - action: wait
        duration: 90s
      - target: inventory
        action: reset
        params: {route: /check}
      - target: order
        action: reset
        params: {route: inventory}
      - target: gateway
        action: reset
        params: {route: order}
    ground_truth:
      service: inventory
      cause: retry_storm_amplification
      distractors: [gateway_overload, traffic_spike]
    context_assertions:
      must_include_service: [inventory, order, gateway]
      must_rank_in_top3: inventory
      must_include_span_repeated:
        - {name: "HTTP GET", min_count: 3}
      must_not_include: ["fault", "inject", "fault-manager", "_fault"]
      max_tokens: 8000
      max_services_included: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: faultctl-retry-storm
  namespace: fault-manager
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: faultctl
          image: docker.io/quang47/llm-rca-faultctl:v1.0
          imagePullPolicy: Always
          securityContext: {runAsUser: 0}
          args: ["-scenario=/etc/faultctl/scenario.yaml", "-demo-namespace=demo"]
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-8-retry-storm}
        - name: ground-truth
          persistentVolumeClaim: {claimName: ground-truth-pvc}
