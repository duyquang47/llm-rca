name: config_error
steps:
  - target: inventory
    action: remove_env_var
    params:
      key: CONFIG_PATH
  - action: wait
    duration: 90s
  - target: inventory
    action: restore_env_var
    params:
      key: CONFIG_PATH
ground_truth:
  service: inventory
  cause: config_error
  distractors: [oom_memory_leak, traffic_spike]
context_assertions:
  must_include_service: [inventory, order]
  must_rank_in_top3: inventory
  must_include_k8s_event_matching: "(?i)BackOff"
  must_not_include: ["fault", "inject", "fault-manager", "_fault"]
  max_tokens: 8000
  max_services_included: 6
