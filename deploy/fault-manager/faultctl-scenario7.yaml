apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-7-cache-down
  namespace: fault-manager
data:
  scenario.yaml: |
    name: cache_down
    steps:
      - target: redis
        action: scale_deployment
        params:
          replicas: 0
      - action: burst_load
        duration: 60s
        params:
          url: "http://gateway.demo:8080/create?user_id=999999&id=1"
          concurrency: 20
      - target: redis
        action: reset_scale
    ground_truth:
      service: redis
      cause: cache_unavailable
      distractors: [traffic_spike, postgres_slow]
    context_assertions:
      must_include_service: [redis, order]
      must_rank_in_top3: redis
      must_include_log_template_matching: "(?i)cache get failed|connection refused|dial tcp"
      must_not_include: ["fault", "inject", "fault-manager", "_fault"]
      max_tokens: 8000
      max_services_included: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: faultctl-cache-down
  namespace: fault-manager
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: faultctl
      containers:
        - name: faultctl
          image: docker.io/quang47/llm-rca-faultctl:v1.0
          imagePullPolicy: Always
          securityContext: {runAsUser: 0}
          args: ["-scenario=/etc/faultctl/scenario.yaml", "-demo-namespace=demo"]
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-7-cache-down}
        - name: ground-truth
          persistentVolumeClaim: {claimName: ground-truth-pvc}
