# Apply only after faultctl-bad-deploy's Job has completed AND the
# full alert->orchestrator->LLM loop has had time to finish (roughly
# 90s wait + ~30-40s alert pending + ~20s collection + LLM latency —
# a few minutes total). Reuses the scenario-02-bad-deploy ConfigMap.
apiVersion: batch/v1
kind: Job
metadata:
  name: evaluator-bad-deploy
  namespace: fault-manager
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: evaluator
          image: docker.io/quang47/llm-rca-evaluator:v1.0
          imagePullPolicy: Always
          args:
            - "-scenario=bad_deploy"
            - "-scenario-file=/etc/faultctl/scenario.yaml"
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
            - {name: CLICKHOUSE_ADDR, value: "clickhouse.observability:9000"}
            - {name: CLICKHOUSE_USER, value: "otel"}
            - {name: CLICKHOUSE_PASSWORD, value: "otel"}
            - {name: CLICKHOUSE_DATABASE, value: "otel"}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-02-bad-deploy}
        - name: ground-truth
          persistentVolumeClaim: {claimName: ground-truth-pvc}
