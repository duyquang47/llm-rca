apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-02-bad-deploy
  namespace: fault-manager
data:
  scenario.yaml: |
    name: bad_deploy
    steps:
      - target: payment
        action: set_config
        params:
          route: /charge
          error: {probability: 0.3, code: 500}
      - action: wait
        duration: 90s
      - target: payment
        action: reset
        params: {route: /charge}
    ground_truth:
      service: payment
      cause: bad_deploy
      distractors: [thirdparty_mock_issue, order_bug]
    context_assertions:
      must_include_service: [payment, order]
      must_rank_in_top3: payment
      must_include_log_template_matching: "(?i)downstream call failed"
      must_include_metric_delta:
        - {name_matches: "http_server_request_duration", min_pct_diff: 20}
      must_not_include: ["fault", "inject", "fault-manager", "_fault"]
      max_tokens: 8000
      max_services_included: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: faultctl-bad-deploy
  namespace: fault-manager
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: faultctl
          image: docker.io/quang47/llm-rca-faultctl:v1.0
          imagePullPolicy: Always
          securityContext: {runAsUser: 0}
          args: ["-scenario=/etc/faultctl/scenario.yaml", "-demo-namespace=demo"]
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-02-bad-deploy}
        - name: ground-truth
          persistentVolumeClaim: {claimName: ground-truth-pvc}
