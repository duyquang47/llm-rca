apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-13-concurrent-faults
  namespace: fault-manager
data:
  scenario.yaml: |
    name: concurrent_faults
    steps:
      - target: inventory
        action: set_config
        params:
          route: /check
          latency: {probability: 1.0, ms: 1300}
      - target: thirdparty-mock
        action: set_config
        params:
          route: /pay
          error: {probability: 1.0, code: 429}
      - action: wait
        duration: 90s
      - target: inventory
        action: reset
        params: {route: /check}
      - target: thirdparty-mock
        action: reset
        params: {route: /pay}
    ground_truth:
      causes:
        - {service: inventory, cause: downstream_latency}
        - {service: thirdparty-mock, cause: third_party_rate_limit}
      distractors: [gateway_overload, order_bug, payment_bug, network_issue]
    context_assertions:
      must_include_service: [inventory, thirdparty-mock, order, payment]
      must_include_log_template_matching: "(?i)downstream call failed|context deadline exceeded|timeout"
      must_not_include: ["fault", "inject", "fault-manager", "_fault"]
      max_tokens: 8000
      max_services_included: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: faultctl-concurrent-faults
  namespace: fault-manager
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: faultctl
          image: docker.io/quang47/llm-rca-faultctl:v1.0
          imagePullPolicy: Always
          securityContext: {runAsUser: 0}
          args: ["-scenario=/etc/faultctl/scenario.yaml", "-demo-namespace=demo"]
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-13-concurrent-faults}
        - name: ground-truth
          persistentVolumeClaim: {claimName: ground-truth-pvc}
