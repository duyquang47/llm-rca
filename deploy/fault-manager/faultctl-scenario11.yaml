apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-11-third-party-rate-limit
  namespace: fault-manager
data:
  scenario.yaml: |
    name: third_party_rate_limit
    steps:
      - target: thirdparty-mock
        action: set_config
        params:
          route: /pay
          error: {probability: 1.0, code: 429}
      - action: wait
        duration: 90s
      - target: thirdparty-mock
        action: reset
        params: {route: /pay}
    ground_truth:
      service: thirdparty-mock
      cause: third_party_rate_limit
      distractors: [payment_bug, network_issue]
    context_assertions:
      must_include_service: [thirdparty-mock, payment]
      must_rank_in_top3: thirdparty-mock
      must_include_log_template_matching: "(?i)downstream call failed"
      must_include_metric_delta:
        - {name_matches: "http_server_request_duration", min_pct_diff: 20}
      must_not_include: ["fault", "inject", "fault-manager", "_fault"]
      max_tokens: 8000
      max_services_included: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: faultctl-third-party-rate-limit
  namespace: fault-manager
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: faultctl
          image: docker.io/quang47/llm-rca-faultctl:v1.0
          imagePullPolicy: Always
          securityContext: {runAsUser: 0}
          args: ["-scenario=/etc/faultctl/scenario.yaml", "-demo-namespace=demo"]
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-11-third-party-rate-limit}
        - name: ground-truth
          persistentVolumeClaim: {claimName: ground-truth-pvc}
