apiVersion: batch/v1
kind: Job
metadata:
  name: evaluator-n-plus-one-query
  namespace: fault-manager
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: evaluator
          image: docker.io/quang47/llm-rca-evaluator:v1.0
          imagePullPolicy: Always
          args:
            - "-scenario=n_plus_one_query"
            - "-scenario-file=/etc/faultctl/scenario.yaml"
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
            - {name: CLICKHOUSE_ADDR, value: "clickhouse.observability:9000"}
            - {name: CLICKHOUSE_USER, value: "otel"}
            - {name: CLICKHOUSE_PASSWORD, value: "otel"}
            - {name: CLICKHOUSE_DATABASE, value: "otel"}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-4-n-plus-one-query}
        - name: ground-truth
          persistentVolumeClaim: {claimName: ground-truth-pvc}
