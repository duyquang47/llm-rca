apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-5-oom-crashloop
  namespace: fault-manager
data:
  scenario.yaml: |
    name: oom_crashloop
    steps:
      - target: inventory
        action: sustain_fault
        duration: 300s
        params:
          route: /check
          mem_leak: true
      - target: inventory
        action: reset
        params: {route: /check}
    ground_truth:
      service: inventory
      cause: oom_memory_leak
      distractors: [traffic_spike, config_error]
    context_assertions:
      must_include_service: [inventory]
      must_rank_in_top3: inventory
      must_include_k8s_event_matching: "(?i)OOMKill|BackOff"
      must_not_include: ["fault", "inject", "fault-manager", "_fault"]
      max_tokens: 8000
      max_services_included: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: faultctl-oom-crashloop
  namespace: fault-manager
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: faultctl
          image: docker.io/quang47/llm-rca-faultctl:v1.0
          imagePullPolicy: Always
          securityContext: {runAsUser: 0}
          args: ["-scenario=/etc/faultctl/scenario.yaml", "-demo-namespace=demo"]
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-5-oom-crashloop}
        - name: ground-truth
          persistentVolumeClaim: {claimName: ground-truth-pvc}
