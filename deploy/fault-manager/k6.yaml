apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-loadtest
  namespace: fault-manager
data:
  basic.js: |
    import http from 'k6/http';

    export const options = {
      // Every request has a random user_id in the URL, and k6 interns one
      // time series per unique tag set — with the default `url` system tag
      // that's a new series per request, so memory grew until the pod hit
      // its limit (~7.7h at 20 rps) and wedged, silently stopping all demo
      // traffic (and thus all traces/logs). Keep only bounded tags; the
      // request is still identified by tags.name.
      systemTags: ['status', 'method', 'name', 'scenario', 'expected_response', 'error_code'],
      discardResponseBodies: true,
      scenarios: {
        background_load: {
          executor: 'constant-arrival-rate',
          rate: 20,
          timeUnit: '1s',
          duration: '24h',
          preAllocatedVUs: 10,
          maxVUs: 50,
        },
      },
    };

    export default function () {
      const userID = Math.floor(Math.random() * 1000000) + 1;
      http.get(`http://gateway.demo:8080/create?user_id=${userID}&id=1`, {
        timeout: '10s',
        tags: { name: 'create' },
      });
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6
  namespace: fault-manager
spec:
  replicas: 1
  selector:
    matchLabels: {app: k6}
  template:
    metadata:
      labels: {app: k6}
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          # --no-summary/--no-thresholds: the end-of-test summary keeps every
          # Trend sample (http_req_duration etc.) in memory to compute
          # percentiles at the end of the 24h run — still ~13MiB/h of growth
          # after the systemTags fix, OOMKilled every ~19h. Nothing reads the
          # summary and the script has no thresholds.
          args: ["run", "--no-summary", "--no-thresholds", "/scripts/basic.js"]
          volumeMounts:
            - {name: script, mountPath: /scripts}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: script
          configMap: {name: k6-loadtest}
