apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-9-consumer-lag
  namespace: chaos
data:
  scenario.yaml: |
    name: consumer_lag
    steps:
      - target: notify-worker
        action: scale_deployment
        params:
          replicas: 0
      - action: wait
        duration: 60s
      - target: notify-worker
        action: reset_scale
    ground_truth:
      service: notify-worker
      cause: consumer_scaled_down
      distractors: [redis_down, traffic_spike]
    context_assertions:
      must_include_service: [notify-worker]
      must_rank_in_top3: notify-worker
      must_not_include: ["fault", "inject", "chaos", "_fault"]
      max_tokens: 8000
      max_services_included: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: faultctl-consumer-lag
  namespace: chaos
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: faultctl
      containers:
        - name: faultctl
          image: faultctl:1.0
          imagePullPolicy: IfNotPresent
          securityContext: {runAsUser: 0}
          args: ["-scenario=/etc/faultctl/scenario.yaml", "-demo-namespace=demo"]
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-9-consumer-lag}
        - name: ground-truth
          hostPath: {path: /var/lib/faultctl/ground-truth, type: DirectoryOrCreate}
