apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-10-poison-message
  namespace: chaos
data:
  scenario.yaml: |
    name: poison_message
    steps:
      - action: publish_poison_message
        params:
          addr: "redis.demo:6379"
          stream: "notifications"
          count: 30
      - action: wait
        duration: 90s
    ground_truth:
      service: notify-worker
      cause: poison_message
      distractors: [consumer_lag, config_error]
    context_assertions:
      must_include_service: [notify-worker]
      must_rank_in_top3: notify-worker
      must_include_k8s_event_matching: "(?i)BackOff"
      must_not_include: ["fault", "inject", "chaos", "_fault"]
      max_tokens: 8000
      max_services_included: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: faultctl-poison-message
  namespace: chaos
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: faultctl
          image: faultctl:1.0
          imagePullPolicy: IfNotPresent
          securityContext: {runAsUser: 0}
          args: ["-scenario=/etc/faultctl/scenario.yaml", "-demo-namespace=demo"]
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-10-poison-message}
        - name: ground-truth
          hostPath: {path: /var/lib/faultctl/ground-truth, type: DirectoryOrCreate}
