apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-loadtest
  namespace: chaos
data:
  basic.js: |
    import http from 'k6/http';

    export const options = {
      scenarios: {
        background_load: {
          executor: 'constant-arrival-rate',
          rate: 20,
          timeUnit: '1s',
          duration: '24h',
          preAllocatedVUs: 10,
          maxVUs: 50,
        },
      },
    };

    export default function () {
      const userID = Math.floor(Math.random() * 1000000) + 1;
      http.get(`http://gateway.demo:8080/create?user_id=${userID}&id=1`, { timeout: '10s' });
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels: {app: k6}
  template:
    metadata:
      labels: {app: k6}
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: ["run", "/scripts/basic.js"]
          volumeMounts:
            - {name: script, mountPath: /scripts}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}
      volumes:
        - name: script
          configMap: {name: k6-loadtest}
