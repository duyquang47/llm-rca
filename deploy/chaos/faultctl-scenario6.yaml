apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-6-cpu-throttling
  namespace: chaos
data:
  scenario.yaml: |
    name: cpu_throttling
    steps:
      - target: inventory
        action: patch_cpu_limit
        params:
          millicores: 100
      - action: wait
        duration: 90s
      - target: inventory
        action: reset_cpu_limit
    ground_truth:
      service: inventory
      cause: cpu_throttling
      distractors: [code_slow, traffic_spike]
    context_assertions:
      must_include_service: [inventory]
      must_rank_in_top3: inventory
      must_include_metric_delta:
        - {name_matches: "cpu_throttled_periods_ratio", min_pct_diff: 100}
      must_not_include: ["fault", "inject", "chaos", "_fault"]
      max_tokens: 8000
      max_services_included: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: faultctl-cpu-throttling
  namespace: chaos
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: faultctl
      containers:
        - name: faultctl
          image: faultctl:1.0
          imagePullPolicy: IfNotPresent
          securityContext: {runAsUser: 0}
          args: ["-scenario=/etc/faultctl/scenario.yaml", "-demo-namespace=demo"]
          env:
            - {name: GROUND_TRUTH_DIR, value: /var/lib/faultctl/ground-truth}
          volumeMounts:
            - {name: scenario, mountPath: /etc/faultctl}
            - {name: ground-truth, mountPath: /var/lib/faultctl/ground-truth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: scenario
          configMap: {name: scenario-6-cpu-throttling}
        - name: ground-truth
          hostPath: {path: /var/lib/faultctl/ground-truth, type: DirectoryOrCreate}
