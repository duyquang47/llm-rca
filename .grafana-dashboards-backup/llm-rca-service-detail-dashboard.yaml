apiVersion: v1
data:
  service-detail.json: |
    {
      "id": null,
      "uid": "llm-rca-service-detail",
      "title": "llm-rca - Service Detail",
      "tags": ["llm-rca"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "label": "Service",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(traces_service_graph_request_total{connection_type!=\"virtual_node\"}, server)", "refId": "service-var"},
            "refresh": 2,
            "includeAll": false,
            "multi": false,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Request rate (as server)",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 1}, "overrides": []},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
             "expr": "sum(rate(traces_service_graph_request_total{server=\"$service\",connection_type!=\"virtual_node\"}[5m]))"}
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error rate (as server)",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "decimals": 2, "thresholds": {"mode": "absolute", "steps": [
            {"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}
          ]}}, "overrides": []},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
             "expr": "100 * sum(rate(traces_service_graph_request_total{server=\"$service\",failed=\"true\",connection_type!=\"virtual_node\"}[5m])) / sum(rate(traces_service_graph_request_total{server=\"$service\",connection_type!=\"virtual_node\"}[5m]))"}
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Latency p95 (as server)",
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s", "decimals": 3}, "overrides": []},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
             "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_service_graph_request_server_seconds_bucket{server=\"$service\"}[5m])))"}
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Latency p99 (as server)",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s", "decimals": 3}, "overrides": []},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
             "expr": "histogram_quantile(0.99, sum by (le) (rate(traces_service_graph_request_server_seconds_bucket{server=\"$service\"}[5m])))"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request rate over time (as server)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "legendFormat": "req/s",
             "expr": "sum(rate(traces_service_graph_request_total{server=\"$service\",connection_type!=\"virtual_node\"}[5m]))"},
            {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "legendFormat": "error/s",
             "expr": "sum(rate(traces_service_graph_request_total{server=\"$service\",failed=\"true\",connection_type!=\"virtual_node\"}[5m]))"}
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency percentiles over time (as server)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "legendFormat": "p50",
             "expr": "histogram_quantile(0.50, sum by (le) (rate(traces_service_graph_request_server_seconds_bucket{server=\"$service\"}[5m])))"},
            {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "legendFormat": "p95",
             "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_service_graph_request_server_seconds_bucket{server=\"$service\"}[5m])))"},
            {"refId": "C", "datasource": {"type": "prometheus", "uid": "prometheus"}, "legendFormat": "p99",
             "expr": "histogram_quantile(0.99, sum by (le) (rate(traces_service_graph_request_server_seconds_bucket{server=\"$service\"}[5m])))"}
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Inbound callers (who calls $service)",
          "description": "req/s and error rate per caller, server=$service",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "format": "table", "instant": true, "datasource": {"type": "prometheus", "uid": "prometheus"},
             "expr": "sum by (client) (rate(traces_service_graph_request_total{server=\"$service\",connection_type!=\"virtual_node\"}[5m]))"}
          ],
          "transformations": [{"id": "renameByRegex", "options": {"regex": "^Value$", "renamePattern": "req/s"}}],
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 2}, "overrides": []}
        },
        {
          "id": 8,
          "type": "table",
          "title": "Outbound calls (what $service calls)",
          "description": "req/s per callee, client=$service",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "format": "table", "instant": true, "datasource": {"type": "prometheus", "uid": "prometheus"},
             "expr": "sum by (server) (rate(traces_service_graph_request_total{client=\"$service\",connection_type!=\"virtual_node\"}[5m]))"}
          ],
          "transformations": [{"id": "renameByRegex", "options": {"regex": "^Value$", "renamePattern": "req/s"}}],
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 2}, "overrides": []}
        },
        {
          "id": 9,
          "type": "table",
          "title": "Recent traces ($service)",
          "description": "Last 200 spans from otel_traces where ServiceName = $service",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 22},
          "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse"},
              "rawSql": "SELECT Timestamp, TraceId, SpanId, ParentSpanId, SpanName, Duration/1000000 AS duration_ms, StatusCode FROM otel.otel_traces WHERE ServiceName = '$service' ORDER BY Timestamp DESC LIMIT 200",
              "format": 1
            }
          ],
          "fieldConfig": {"defaults": {}, "overrides": []}
        },
        {
          "id": 10,
          "type": "table",
          "title": "Recent logs ($service)",
          "description": "Last 200 log records from otel_logs where ServiceName = $service. Note: only services that export logs via OTLP will have data here (currently only notify-worker in this demo).",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 31},
          "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse"},
              "rawSql": "SELECT Timestamp, SeverityText, Body FROM otel.otel_logs WHERE ServiceName = '$service' ORDER BY Timestamp DESC LIMIT 200",
              "format": 1
            }
          ],
          "fieldConfig": {"defaults": {}, "overrides": []}
        }
      ]
    }
kind: ConfigMap
