apiVersion: v1
data:
  servicegraph.json: |
    {
      "id": null,
      "uid": "llm-rca-servicegraph",
      "title": "llm-rca - Service Graph (live)",
      "tags": ["llm-rca"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 10,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "nodeGraph",
          "title": "demo namespace - service call graph (req/s over last 5m)",
          "description": "Node = mainStat is total req/s touching that service (as client + server). Edge = mainStat is req/s on that call path. Source: otel-collector's servicegraph connector, built from live span parent/child pairs (same relation as internal/telemetry/clickhouse/source.go's DependencyGraph()).",
          "gridPos": {"h": 20, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "edges",
              "format": "table",
              "instant": true,
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "label_replace(label_replace(label_join(sum by (client, server) (rate(traces_service_graph_request_total{connection_type!=\"virtual_node\"}[5m])), \"id\", \"_\", \"client\", \"server\"), \"source\", \"$1\", \"client\", \"(.*)\"), \"target\", \"$1\", \"server\", \"(.*)\")"
            },
            {
              "refId": "nodes",
              "format": "table",
              "instant": true,
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (id, mainStat) (label_replace(label_replace(sum by (client) (rate(traces_service_graph_request_total{connection_type!=\"virtual_node\"}[5m])), \"id\", \"$1\", \"client\", \"(.*)\"), \"mainStat\", \"$1\", \"client\", \"(.*)\") or label_replace(label_replace(sum by (server) (rate(traces_service_graph_request_total{connection_type!=\"virtual_node\"}[5m])), \"id\", \"$1\", \"server\", \"(.*)\"), \"mainStat\", \"$1\", \"server\", \"(.*)\"))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 1
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "id"},
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Xem chi tiết service",
                        "url": "/d/llm-rca-service-detail/llm-rca-service-detail?var-service=${__data.fields.id}",
                        "targetBlank": false
                      }
                    ]
                  }
                ]
              }
            ]
          }
        }
      ]
    }
kind: ConfigMap
