# Case #12 (CLAUDE.md §7): remove CONFIG_PATH from inventory's
# Deployment, causing every restart to fail before the process can
# even bind its listeners — cmd/chain/main.go's run() returns an error
# on missing CONFIG_PATH before otelinit.Setup() is ever called, so
# unlike every other fault, this one produces *zero* app-level
# telemetry from inventory itself (no traces, no logs, no metrics) —
# the only evidence is k8s-level: CrashLoopBackOff events and
# inventory showing 0 available replicas the whole window (reuses
# case #9's DeploymentUnavailable alert as-is), plus order's own
# error rate from getting connection-refused on every call to
# inventory (same propagation shape as case #1, just via a dead
# listener instead of a slow one).
#
# Distinct from case #5's target env var (this instead patches the
# Deployment spec directly, and no sustain_fault is needed — unlike
# in-memory fault state, a removed env var stays removed across every
# pod restart on its own until restore_env_var runs).
name: config_error
steps:
  - target: inventory
    action: remove_env_var
    params:
      key: CONFIG_PATH
  - action: wait
    duration: 90s
  - target: inventory
    action: restore_env_var
    params:
      key: CONFIG_PATH

ground_truth:
  service: inventory
  cause: config_error
  distractors: [oom_memory_leak, traffic_spike]

context_assertions:
  must_include_service: [inventory, order]
  must_rank_in_top3: inventory
  must_include_k8s_event_matching: "(?i)BackOff"
  must_not_include: ["fault", "inject", "chaos", "_fault"]
  max_tokens: 8000
  max_services_included: 6
