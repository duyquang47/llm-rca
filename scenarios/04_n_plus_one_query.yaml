# Case #4 (CLAUDE.md §7): N+1 query pattern on inventory. The
# distinguishing signal isn't latency or an error — it's that a single
# request fires 6 "pg.query" spans instead of 1 (handler.go's query()).
# n_plus_one uses the same static-config-vs-/_fault-override precedence
# as pool_size (§4.4), keyed the same way (route="db").
name: n_plus_one_query
steps:
  - target: inventory
    action: set_config
    params:
      route: db
      n_plus_one: true
  - action: wait
    duration: 90s
  - target: inventory
    action: reset
    params: {route: db}

ground_truth:
  service: inventory
  cause: n_plus_one_query
  distractors: [postgres_slow, traffic_spike]

context_assertions:
  must_include_service: [inventory]
  must_rank_in_top3: inventory
  must_include_span_repeated:
    - {name: "pg.query", min_count: 3}
  must_not_include: ["fault", "inject", "chaos", "_fault"]
  max_tokens: 8000
  max_services_included: 6
