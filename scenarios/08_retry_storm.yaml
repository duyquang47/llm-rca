# Case #8 (CLAUDE.md §7): retry amplification across 2 hops
# (gateway->order, order->inventory) on top of a hard failure at
# inventory. Needed retry counts to be dynamically overridable via
# /_fault first — they were static-ConfigMap-only, same gap
# pool_size/n_plus_one had before their own cases. Added
# faults.Spec.Retry + Controller.EffectiveRetry, keyed by the
# downstream call's target name (route="inventory" for order's call,
# route="order" for gateway's call) — same "route is really just an
# arbitrary fault-scope key" overload pool_size already uses.
#
# The distinguishing signal isn't just "inventory has high error rate"
# (that's case #2's shape) — it's that ONE order request now fires 3
# client spans at inventory instead of the normal 1 (order's own
# `calls: [inventory, payment]` normally produces exactly 2 "HTTP GET"
# spans per trace: one per target; because inventory always fails,
# order's early-return-on-first-failure means payment is never even
# reached, so the only client spans left are inventory's 3 retries —
# reuses must_include_span_repeated as-is, built for case #4).
name: retry_storm
steps:
  - target: inventory
    action: set_config
    params:
      route: /check
      error: {probability: 1.0, code: 500}
  - target: order
    action: set_config
    params:
      route: inventory
      retry: 2
  - target: gateway
    action: set_config
    params:
      route: order
      retry: 2
  - action: wait
    duration: 90s
  - target: inventory
    action: reset
    params: {route: /check}
  - target: order
    action: reset
    params: {route: inventory}
  - target: gateway
    action: reset
    params: {route: order}

ground_truth:
  service: inventory
  cause: retry_storm_amplification
  distractors: [gateway_overload, traffic_spike]

context_assertions:
  must_include_service: [inventory, order, gateway]
  must_rank_in_top3: inventory
  must_include_span_repeated:
    - {name: "HTTP GET", min_count: 3}
  must_not_include: ["fault", "inject", "chaos", "_fault"]
  max_tokens: 8000
  max_services_included: 6
