# Case #7 (CLAUDE.md §7): redis (order's cache) scaled to 0. redis has
# no /_fault endpoint — it isn't a chain-service instance — so this
# uses scale_deployment/reset_scale (k8s API, same RBAC as case #6's
# patch_cpu_limit).
#
# Needed a real handler change first: cacheGet used to only ever log a
# warning and never change control flow, so downstream always got
# called regardless of cache state — disabling redis would have
# changed nothing observable. internal/chain/handler.go now has a real
# cache-aside short-circuit (hit -> skip downstream). To keep every
# other scenario's traffic-to-inventory volume unchanged, k6
# (loadtest/basic.js) now randomizes user_id across a wide range so
# the *baseline* cache hit rate stays near zero — case #7's signal
# comes from redis being unreachable (every cacheGet call now errors,
# not just occasionally misses), not from an ambient hit-rate change.
#
# burst_load is paired in because baseline traffic already reaches
# inventory on (almost) every request even with cache healthy (hit
# rate ~0), so redis alone going down doesn't move any SLO metric on
# its own — nothing would alert, no incident would ever get created.
# The burst simultaneously makes "traffic_spike" a genuinely live
# distractor: the pack will show elevated latency from the burst AND
# ~100% "cache get failed" from redis being down, and the real test is
# whether the LLM weighs the qualitative log evidence over the
# metric-only evidence correctly.
#
# ground_truth.service is "redis", not "order" — this was corrected
# after a real live run: redis has no app-level spans/metrics, but the
# LLM correctly cited the raw k8s ScalingReplicaSet event ("Scaled
# down replica set redis-... from 1 to 0") as its top-ranked evidence,
# which is a more precise answer than attributing the failure to
# order (the caller). servicesIn() in assertions.go never scans
# K8sContext.Events though — added mentionedInK8sEvents() as a
# substring fallback so must_include_service: [redis] can actually
# pass.
name: cache_down
steps:
  - target: redis
    action: scale_deployment
    params:
      replicas: 0
  - action: burst_load
    duration: 60s
    params:
      url: "http://gateway.demo:8080/create?user_id=999999&id=1"
      concurrency: 20
  - target: redis
    action: reset_scale

ground_truth:
  service: redis
  cause: cache_unavailable
  distractors: [traffic_spike, postgres_slow]

context_assertions:
  must_include_service: [redis, order]
  must_rank_in_top3: redis
  must_include_log_template_matching: "(?i)cache get failed|connection refused|dial tcp"
  must_not_include: ["fault", "inject", "fault-manager", "_fault"]
  max_tokens: 8000
  max_services_included: 6
