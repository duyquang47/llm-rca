# Case #3 (CLAUDE.md §7): pool_size dropped to 2 while load keeps
# coming in. The whole point ("Khó") is that generic latency alone
# can't tell "not enough connections" apart from "DB is slow" — that's
# why db_pool_wait_seconds exists as its own metric (handler.go's
# dbPoolWait), not folded into overall request duration.
#
# routeKeyForDB always keys pool-size faults as route="db" regardless
# of the HTTP route (internal/chain/handler/handler.go), so that's
# what set_config/reset must target here, not "/check".
#
# The background k6 load (20rps) alone never contends for just 2
# Postgres connections — each query is a few ms, so 2 connections
# comfortably clear 20rps with no queueing. CLAUDE.md §7 explicitly
# calls for "pool_size=2 + tăng tải"; burst_load supplies that "tăng
# tải" by hammering gateway with 30 concurrent requests for the
# fault's duration, forcing real contention on the 2-connection pool.
name: db_pool_exhaustion
steps:
  - target: inventory
    action: set_config
    params:
      route: db
      pool_size: 2
  - action: burst_load
    duration: 60s
    params:
      url: "http://gateway.demo:8080/create?user_id=1&id=1"
      concurrency: 30
  - target: inventory
    action: reset
    params: {route: db}

ground_truth:
  service: inventory
  cause: connection_pool_exhausted
  distractors: [postgres_slow, traffic_spike]

context_assertions:
  must_include_service: [inventory, order]
  must_rank_in_top3: inventory
  must_include_metric_delta:
    - {name_matches: "db_pool_wait", min_pct_diff: 100}
  must_not_include: ["fault", "inject", "chaos", "_fault"]
  max_tokens: 8000
  max_services_included: 6
