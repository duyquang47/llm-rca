# Case #2 (CLAUDE.md §7): a bad deploy on payment causes intermittent
# errors (not latency) — root cause and symptom are at the same hop,
# unlike case #1's cascade, so this tests whether the LLM still
# correctly attributes cause rather than over-crediting whichever
# service happens to be closest to the alerting gateway.
name: bad_deploy
steps:
  - target: payment
    action: set_config
    params:
      route: /charge
      error: {probability: 0.3, code: 500}
  - action: wait
    duration: 90s
  - target: payment
    action: reset
    params: {route: /charge}

ground_truth:
  service: payment
  cause: bad_deploy
  distractors: [thirdparty_mock_issue, order_bug]

context_assertions:
  must_include_service: [payment, order]
  must_rank_in_top3: payment
  must_include_log_template_matching: "(?i)downstream call failed"
  must_include_metric_delta:
    - {name_matches: "http_server_request_duration", min_pct_diff: 20}
  must_not_include: ["fault", "inject", "fault-manager", "_fault"]
  max_tokens: 8000
  max_services_included: 6
