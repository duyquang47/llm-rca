# Case #6 (CLAUDE.md §7): CPU limit patched directly on the Deployment
# (100m, not the usual 200m) rather than through /_fault — this fault
# has no /_fault equivalent, so it uses patch_cpu_limit/reset_cpu_limit
# (k8s API, RBAC in deploy/chaos/rbac.yaml). CLAUDE.md §2.4/§7 flags
# this class of fault as a real isolation risk: the resulting rollout
# generates ordinary k8s Events in namespace "demo" that the chaos-
# namespace exclusion never touches — see
# internal/scenario/assertions_test.go's
# TestCheckPack_DirectK8sPatchEventShapeDoesNotLeak for the dedicated
# check CLAUDE.md calls for.
#
# Patching the limit alone wasn't enough to produce real throttling —
# live testing showed inventory's actual CPU demand at 20rps of
# trivial SELECT queries is low (mostly waiting on I/O, not computing),
# so even 100m comfortably handled it with almost no throttled
# periods. cpu_burn (already supported via /_fault, 200ms of busy-loop
# per request) stands in for "this endpoint does real CPU work under
# normal operation" — without it there's no way to demonstrate a limit
# being *too low* for legitimate work, only that trivial work needs
# almost no CPU regardless of the limit.
#
# patch_cpu_limit triggers a Deployment rollout — a brand new pod, with
# fresh (empty) in-memory fault state, same issue case #5 hit with
# OOMKill/restart. A one-shot set_config for cpu_burn would race the
# rollout (it might land on the old pod right before it terminates,
# missing the new one entirely). sustain_fault re-POSTs every 3s for
# its own duration, which both self-heals that race and doubles as the
# wait step.
name: cpu_throttling
steps:
  - target: inventory
    action: patch_cpu_limit
    params:
      millicores: 100
  - target: inventory
    action: sustain_fault
    duration: 90s
    params:
      route: /check
      cpu_burn: true
  - target: inventory
    action: reset_cpu_limit
  - target: inventory
    action: reset
    params: {route: /check}

ground_truth:
  service: inventory
  cause: cpu_throttling
  distractors: [code_slow, traffic_spike]

context_assertions:
  must_include_service: [inventory]
  must_rank_in_top3: inventory
  must_include_metric_delta:
    - {name_matches: "cpu_throttled_periods_ratio", min_pct_diff: 100}
  must_not_include: ["fault", "inject", "chaos", "_fault"]
  max_tokens: 8000
  max_services_included: 6
