# Case #9 (CLAUDE.md §7): notify-worker scaled to 0. Its own row
# description is the whole point: "queue backlog, API vẫn 200 OK" —
# order's publish to the Redis Stream is XADD, which succeeds whether
# or not any consumer exists, so nothing about order's own HTTP
# behavior changes at all. Reuses scale_deployment/reset_scale as-is
# (built for case #7's redis-down) — no new faultctl code needed.
#
# Needed a new alert (deploy/rca/prometheusrule.yaml's
# DeploymentUnavailable, from kube-state-metrics' already-deployed
# kube_deployment_status_replicas_available) since neither
# HighP99Latency nor HighErrorRate has anything to fire on here — no
# burst_load needed either, since this alert only depends on replica
# count staying at 0, not on request volume.
#
# 60s wasn't enough in live testing: the alert reached "pending" but
# never "firing" before reset_scale cleared the condition again — the
# rule's own `for: 30s` plus kube-state-metrics' own scrape interval
# (~30s) eats meaningfully into the wait window. 120s gives a
# comfortable margin.
name: consumer_lag
steps:
  - target: notify-worker
    action: scale_deployment
    params:
      replicas: 0
  - action: wait
    duration: 120s
  - target: notify-worker
    action: reset_scale

ground_truth:
  service: notify-worker
  cause: consumer_scaled_down
  distractors: [redis_down, traffic_spike]

context_assertions:
  must_include_service: [notify-worker]
  must_rank_in_top3: notify-worker
  must_not_include: ["fault", "inject", "fault-manager", "_fault"]
  max_tokens: 8000
  max_services_included: 6
