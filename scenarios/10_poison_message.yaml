# Case #10 (CLAUDE.md §7): a malformed message on the "notifications"
# Redis Stream. The poison-message trigger already exists in
# internal/chain/consumer.processEntry (a deliberate panic — see its
# package doc — on a missing "published_at" field, simulating "1
# message làm chết consumer"), but order's own publish() always writes
# a well-formed message, so injecting a bad one needs a direct redis
# client — new publish_poison_message faultctl action, no /_fault knob
# reaches this since it's not any demo service's own misbehavior.
#
# count: 30, not 1 — a single crash's restart has no backoff delay
# (only the second+ restart does), nowhere near enough downtime to
# cross DeploymentUnavailable's for:30s threshold. Each XReadGroup
# call fetches up to 10 entries and panics on the first poison one,
# leaving the rest pending for the next restart to immediately re-hit
# — a large burst keeps that crash-restart cycle going long enough for
# growing backoff delays to accumulate real downtime.
name: poison_message
steps:
  - action: publish_poison_message
    params:
      addr: "redis.demo:6379"
      stream: "notifications"
      count: 30
  - action: wait
    duration: 90s

ground_truth:
  service: notify-worker
  cause: poison_message
  distractors: [consumer_lag, config_error]

context_assertions:
  must_include_service: [notify-worker]
  must_rank_in_top3: notify-worker
  must_include_k8s_event_matching: "(?i)BackOff"
  must_not_include: ["fault", "inject", "fault-manager", "_fault"]
  max_tokens: 8000
  max_services_included: 6
